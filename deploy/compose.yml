# Production stack. nginx stays on the host, where certbot manages TLS.
#
#   docker compose -f deploy/compose.yml --env-file deploy/.env up -d --build
# Named explicitly: the default would be this directory's name, `deploy`, which says nothing
# and would collide with any other product deployed the same way on the host.
name: rakurs

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rakurs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: rakurs
    volumes: ['rakurs-db:/var/lib/postgresql/data']
    # No ports section on purpose: the database is reachable only from this
    # compose network, never from the host or the internet.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rakurs']
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://rakurs:${POSTGRES_PASSWORD}@postgres:5432/rakurs
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      META_APP_SECRET: ${META_APP_SECRET:?set META_APP_SECRET}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:?set META_WEBHOOK_VERIFY_TOKEN}
      META_APP_ID: ${META_APP_ID:?set META_APP_ID}
      META_ES_CONFIG_ID: ${META_ES_CONFIG_ID:?set META_ES_CONFIG_ID}
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:?set CREDENTIALS_KEY}
      MEDIA_DIR: /var/lib/rakurs/media
      PUBLIC_URL: ${PUBLIC_URL}
      KASPI_POS_URL: ${KASPI_POS_URL:-}
      WHATSAPP_QR_ENABLED: ${WHATSAPP_QR_ENABLED:-true}
    # Bound to loopback: only nginx on this host can reach it, whatever the
    # firewall happens to say.
    ports: ['127.0.0.1:3000:3000']
    volumes:
      # Named, not a bind mount: the files belong to the container's lifecycle, not to
      # the checkout, so `docker compose down` does not take a client's photographs with it.
      - media:/var/lib/rakurs/media
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  kaspi-pos:
    profiles: [kaspi-pos]
    build:
      context: ./kaspi-pos
    restart: unless-stopped
    environment:
      PORT: "3000"
      TOKEN_SECRET_KEY: ${KASPI_POS_TOKEN_SECRET_KEY:-}
      APP_VERSION: ${KASPI_POS_APP_VERSION:-4.112.1}
      APP_BUILD: ${KASPI_POS_APP_BUILD:-1107}
      APP_PLATFORM: ${KASPI_POS_APP_PLATFORM:-iOS}
      APP_PLATFORM_VER: ${KASPI_POS_APP_PLATFORM_VER:-18.4}
      KASPI_POS_PROXY_URL: ${KASPI_POS_PROXY_URL:-}
    volumes:
      - kaspi-pos-state:/app/state
    expose: ["3000"]

volumes:
  rakurs-db:
  media:
  kaspi-pos-state:
