# Replace rakurs.example.com with the real domain. It occurs five times in this file.

server {
  listen 443 ssl;
  http2 on;
  server_name rakurs.example.com;

  ssl_certificate     /etc/letsencrypt/live/rakurs.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/rakurs.example.com/privkey.pem;

  root /var/www/rakurs;
  index index.html;

  # The router lives in the browser. Without this, a refresh on /a/:agentId/dialogs is a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # /api/whatsapp/webhook is the address given to Meta. Meta posts webhook deliveries here,
  # and the signature is over the exact bytes, so nothing in front of the application may
  # rewrite the body — this block only proxies, on purpose.
  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Meta sync and model analysis take tens of seconds.
    proxy_read_timeout 120s;

    client_max_body_size 1m;
  }
}

server {
  listen 80;
  server_name rakurs.example.com;
  return 301 https://$host$request_uri;
}
